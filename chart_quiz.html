<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horn TMA chart quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E9ED; --paper:#FBF8EA; --ink:#1B2631; --muted:#5B6873; --line:#C9D1D7;
  --holder:#2F4A63; --ok:#2C7A4B; --okbg:#E1F1E6; --bad:#B23A2E; --badbg:#F8E3E0; --focus:#1F6FB2;
  --ENTRY:#B1495E; --POINT:#2F6F9F; --FREQ:#6B5BA8; --MVA:#B07A1E; --VERT:#3E8C8A;
  --m-out:#ECEEE6; --m-tma:#FBFAF4; --m-nav:#232F72; --m-ctr:#F3EBCB; --m-ctrl:#8F82AE; --m-dash:#8F82AE; --m-hl:#E0457B; --m-hlf:rgba(224,69,123,.32);
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121B23; --paper:#1D2934; --ink:#E6ECF0; --muted:#9AA8B3; --line:#33424F;
    --holder:#8FB3D1; --ok:#6CC791; --okbg:#1B3527; --bad:#EE8577; --badbg:#3B2220; --focus:#7DB8EA;
    --m-out:#17222C; --m-tma:#22303C; --m-nav:#C9D6F2; --m-ctr:#3A3A2C; --m-ctrl:#9C90BC; --m-dash:#7F76A0; --m-hl:#FF6B9C; --m-hlf:rgba(255,107,156,.30);
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
a.back{display:block;max-width:820px;margin:0 auto;padding:12px 18px 0;font:600 14px system-ui,sans-serif;color:var(--holder);text-decoration:none}
main{max-width:820px;margin:0 auto;padding:16px 18px 60px}
h1{font-family:var(--cond);font-weight:700;font-size:clamp(2rem,6vw,2.9rem);line-height:1.05;margin:0 0 6px;letter-spacing:.2px}
h2{font-family:var(--cond);font-weight:600;font-size:1.5rem;margin:22px 0 6px}
h3{font-family:var(--cond);font-weight:600;font-size:1.25rem;margin:18px 0 4px}
p.lede{color:var(--muted);margin:0 0 20px;max-width:62ch}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
code{font-family:var(--mono);font-size:.93em}

.sect{font-family:var(--cond);font-weight:600;font-size:1.05rem;margin:20px 0 8px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.picker{display:grid;gap:8px;margin:0 0 6px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:9px 12px;display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;text-align:left}
.chip .sw{width:10px;height:100%;min-height:22px;border-radius:2px;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.45}
.chip b{font-weight:600}
.chip small{display:block;color:var(--muted);font-size:.9rem;line-height:1.3}
.chip .ct{font-family:var(--cond);color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:18px;margin:14px 0 22px;color:var(--muted)}
.opts label{display:flex;gap:10px;align-items:center}
select{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:5px 10px}
.primary{background:var(--holder);color:var(--paper);border:0;border-radius:6px;padding:12px 22px;font-weight:600;font-size:1.05rem}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:6px;padding:10px 18px;font-weight:500}
.mini-btn{background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:5px 12px;font-size:.92rem;font-weight:500}
.mini-btn[aria-pressed="true"]{border-color:var(--holder);background:var(--holder);color:var(--paper)}
.legend{margin-top:22px;color:var(--muted);font-size:.95rem;max-width:62ch}
.legend b{color:var(--ink);font-weight:600}
details.ref{margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 16px}
details.ref summary{cursor:pointer;font-weight:600}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin:6px 0 14px;background:var(--paper);border:1px solid var(--line)}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--cond);font-weight:600;font-size:1.02rem;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.namelist{columns:4 7em;column-gap:16px;font-family:var(--mono);font-size:.92rem;margin:6px 0 12px}

/* map */
.map{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:5px;background:var(--m-out);touch-action:manipulation}
.map .out{fill:var(--m-out)}
.map .tma{fill:var(--m-tma);stroke:var(--m-nav);stroke-width:2.6;stroke-linejoin:round}
.map .sub-hl{fill:var(--m-hlf);stroke:var(--m-hl);stroke-width:5}
.map .adj{fill:var(--m-hlf);stroke:var(--m-hl);stroke-width:4;stroke-dasharray:14 8}
.map .ctr{fill:var(--m-ctr);stroke:var(--m-ctrl);stroke-width:2.5}
.map .dash{fill:none;stroke:var(--m-dash);stroke-width:2.5;stroke-dasharray:12 9}
.map .circ{fill:var(--m-tma);stroke:var(--m-nav);stroke-width:2.6}
.map .circ.hl{fill:var(--m-hlf);stroke:var(--m-hl);stroke-width:5}
.map .sym{fill:none;stroke:var(--m-nav);stroke-width:2.6}
.map .symf{fill:var(--m-nav);stroke:none}
.map .symp{fill:var(--m-tma);stroke:var(--m-nav);stroke-width:2.6}
.map .ring{fill:none;stroke:var(--m-hl);stroke-width:5}
.map .pulse{fill:none;stroke:var(--m-hl);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.2);opacity:0}}
.map text{font-family:var(--cond);font-weight:600;fill:var(--m-nav);paint-order:stroke;stroke:var(--m-tma);stroke-width:5px;stroke-linejoin:round}
.map text.tgt{fill:var(--m-hl);font-weight:700}
.map text.big{font-weight:700;opacity:.85}
.map text.ov{font-weight:700}
@media (prefers-reduced-motion: reduce){.map .pulse{animation:none;opacity:0}.bar i{transition:none}}

/* question */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;font-family:var(--cond);font-size:1.05rem;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-bottom:18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--holder);transition:width .25s}
.strip{display:grid;grid-template-columns:14px 1fr;background:var(--paper);border-radius:4px;border:1px solid var(--line);overflow:hidden}
.strip .bay{background:var(--c)}
.strip .body{padding:16px 18px 18px;min-width:0}
.meta{display:grid;grid-template-columns:auto 1fr;border-bottom:1px solid var(--line);margin:-16px -18px 14px;font-family:var(--cond);font-size:1rem}
.meta span{padding:6px 12px;border-right:1px solid var(--line);white-space:nowrap}
.meta span:last-child{border-right:0;color:var(--muted);text-align:right}
.qtext{font-size:1.12rem;font-weight:500;margin:0 0 10px}
.maptools{display:flex;justify-content:flex-end;gap:8px;margin:-4px 0 8px}
form.ans{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:14px}
form.ans label{display:grid;gap:3px;font-family:var(--cond);color:var(--muted);font-size:1rem;flex:1 1 140px}
form.ans input{font:600 1.15rem var(--mono);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:9px 12px;width:100%;text-transform:uppercase;letter-spacing:.5px}
form.ans input:focus{border-color:var(--holder)}
form.ans input:disabled{opacity:.75}
form.ans input.good{border-color:var(--ok);background:var(--okbg)}
form.ans input.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:14px;padding:12px 14px;border-radius:5px;border-left:4px solid var(--c2);background:var(--bg)}
.fb strong{display:block;margin-bottom:2px}
.fb p{margin:4px 0}
.fb .override{margin-top:6px;background:none;border:0;padding:0;color:var(--holder);text-decoration:underline;font-size:.92rem}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

/* results */
.score{font-family:var(--cond);font-weight:700;font-size:clamp(3rem,12vw,5rem);line-height:1;margin:6px 0 2px}
.miss{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:4px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,240px);gap:14px;align-items:start}
.miss p{margin:4px 0}
.miss .ans{color:var(--ok);font-weight:600}
.miss .yours{color:var(--bad)}
.miss .ref{font-family:var(--cond);color:var(--muted)}
@media (max-width:560px){.miss{grid-template-columns:1fr}}
</style>
</head>

const PTS=[{"n": "STA", "x": 638, "y": 604, "k": "vor", "e": true, "l": "n"},{"n": "CRONA", "x": 727, "y": 561, "k": "tri", "e": true, "l": "n"},{"n": "MARCO", "x": 804, "y": 524, "k": "tri", "e": true, "l": "n"},{"n": "HOFFA", "x": 903, "y": 553, "k": "tri", "e": true, "l": "ne"},{"n": "HARBO", "x": 953, "y": 589, "k": "tri", "e": true, "l": "ne"},{"n": "STEGE", "x": 1017, "y": 635, "k": "tri", "e": true, "l": "ne"},{"n": "ROX", "x": 823, "y": 627, "k": "vor", "e": false, "l": "s"},{"n": "DEMUS", "x": 702, "y": 761, "k": "tri", "e": false, "l": "w"},{"n": "NM", "x": 720, "y": 857, "k": "ndb", "e": false, "l": "n"},{"n": "IDN", "x": 924, "y": 821, "k": "vor", "e": false, "l": "s"},{"n": "DEENA", "x": 855, "y": 863, "k": "tri", "e": false, "l": "e"},{"n": "MAL", "x": 694, "y": 906, "k": "vor", "e": false, "l": "s"},{"n": "TOMPA", "x": 828, "y": 924, "k": "tri", "e": false, "l": "e"},{"n": "SM", "x": 666, "y": 952, "k": "ndb", "e": false, "l": "w"},{"n": "LANDI", "x": 668, "y": 989, "k": "tri", "e": false, "l": "sw"},{"n": "ENEBY", "x": 771, "y": 984, "k": "ftri", "e": false, "l": "n"},{"n": "DALHEM", "x": 869, "y": 986, "k": "ftri", "e": false, "l": "n"},{"n": "GALLO", "x": 967, "y": 987, "k": "tri", "e": false, "l": "e"},{"n": "BELOX", "x": 1101, "y": 986, "k": "tri", "e": false, "l": "e"},{"n": "OW", "x": 759, "y": 1036, "k": "ndb", "e": false, "l": "n"},{"n": "HRN", "x": 816, "y": 1036, "k": "vor", "e": false, "l": "s"},{"n": "OE", "x": 870, "y": 1036, "k": "ndb", "e": false, "l": "n"},{"n": "TOR", "x": 1078, "y": 1063, "k": "vor", "e": false, "l": "w"},{"n": "ESTER", "x": 1336, "y": 1102, "k": "tri", "e": true, "l": "n"},{"n": "MARSTA", "x": 774, "y": 1092, "k": "ftri", "e": false, "l": "sw"},{"n": "BLACKA", "x": 843, "y": 1097, "k": "ftri", "e": false, "l": "se"},{"n": "SEMPO", "x": 668, "y": 1096, "k": "tri", "e": false, "l": "w"},{"n": "POLKA", "x": 967, "y": 1096, "k": "tri", "e": false, "l": "e"},{"n": "ANDIE", "x": 827, "y": 1157, "k": "tri", "e": false, "l": "s"},{"n": "HAKAR", "x": 215, "y": 1093, "k": "tri", "e": true, "l": "n"},{"n": "ASK", "x": 458, "y": 1097, "k": "vor", "e": false, "l": "n"},{"n": "BELLO", "x": 605, "y": 1185, "k": "tri", "e": false, "l": "s"},{"n": "PETAK", "x": 147, "y": 1255, "k": "tri", "e": true, "l": "n"},{"n": "VET", "x": 327, "y": 1265, "k": "vor", "e": false, "l": "n"},{"n": "REMOX", "x": 230, "y": 1354, "k": "tri", "e": true, "l": "nw"},{"n": "DISLA", "x": 244, "y": 1363, "k": "tri", "e": true, "l": "e"},{"n": "PADDI", "x": 465, "y": 1453, "k": "tri", "e": true, "l": "s"},{"n": "SKI", "x": 610, "y": 1500, "k": "vor", "e": true, "l": "s"},{"n": "PELLE", "x": 826, "y": 1518, "k": "tri", "e": true, "l": "s"},{"n": "VRM", "x": 1003, "y": 1312, "k": "vor", "e": false, "l": "n"},{"n": "OV", "x": 1051, "y": 1284, "k": "ndb", "e": false, "l": "n"}];
const SECT=[{"id": "N", "name": "North (STA–STEGE)", "up": "FL205", "lo": "4500ft", "mva": 5000, "p": [[612, 618], [638, 604], [727, 561], [804, 524], [840, 509], [903, 553], [953, 589], [1017, 635]]},{"id": "NC", "name": "North-centre (ROX)", "up": "FL205", "lo": "2000ft", "mva": 2500, "p": [[612, 618], [1017, 635], [1121, 951], [1075, 1104], [1033, 806], [566, 756]]},{"id": "C", "name": "Centre (HRN)", "up": "FL205", "lo": "1500ft", "mva": 2000, "p": [[566, 756], [1033, 806], [1075, 1104], [787, 1291], [458, 1097], [466, 1043]]},{"id": "W", "name": "West (VET)", "up": "FL205", "lo": "4500ft", "mva": 5000, "p": [[232, 1050], [466, 1043], [458, 1097], [427, 1440], [274, 1392], [244, 1363], [230, 1354], [141, 1273], [147, 1255], [215, 1093]]},{"id": "SW", "name": "South-west (SKI)", "up": "FL205", "lo": "2500ft", "mva": 3000, "p": [[458, 1097], [787, 1291], [789, 1518], [653, 1515], [610, 1500], [465, 1453], [427, 1440]]},{"id": "SE", "name": "South-east (VRM)", "up": "FL205", "lo": "1500ft", "mva": 2000, "p": [[787, 1291], [1075, 1104], [1316, 1144], [1134, 1526], [826, 1518], [789, 1518]]},{"id": "E", "name": "East (ESTER)", "up": "FL205", "lo": "4500ft", "mva": 5000, "p": [[1121, 951], [1376, 1016], [1336, 1102], [1316, 1144], [1075, 1104]]}];
const CIRC=[{"id": "c2900", "x": 949, "y": 836, "r": 38, "mva": 2900},{"id": "c2400", "x": 1001, "y": 1140, "r": 38, "mva": 2400}];
const ADJ=[{"id": "1", "f": "124.150", "p": [[100, 440], [1064, 440], [985, 612], [1017, 635], [1121, 951], [100, 761]]},{"id": "2X", "f": "128.950", "p": [[100, 761], [535, 842], [466, 1043], [458, 1097], [427, 1440], [257, 1600], [100, 1600]]},{"id": "3", "f": "131.100", "p": [[535, 842], [1121, 951], [1376, 1016], [1336, 1102], [1316, 1144], [1134, 1526], [1167, 1600], [257, 1600], [427, 1440], [458, 1097], [466, 1043]]},{"id": "4", "f": "126.300", "p": [[1376, 1016], [1420, 1027], [1420, 1600], [1167, 1600], [1134, 1526], [1316, 1144], [1336, 1102]]},{"id": "5", "f": "128.400", "p": [[1064, 440], [1420, 440], [1420, 1027], [1376, 1016], [1121, 951], [1017, 635], [985, 612]]}];
const CTRS=[[[703, 1007], [815, 969], [937, 1008], [937, 1071], [815, 1108], [703, 1067]], [[727, 789], [778, 817], [752, 941], [660, 1020], [611, 989], [632, 869]], [[969, 1251], [1091, 1227], [1121, 1277], [1041, 1371], [916, 1395], [887, 1345]]];
const TOPICS={
  ENTRY:{t:"TMA entry/exit points",d:"A point on the TMA boundary is highlighted: type its name."},
  POINT:{t:"All points in the TMA",d:"Any point in the TMA (including entry/exit points and navaids) is highlighted: type its name."},
  FREQ:{t:"Adjacent sector frequencies",d:"A neighbouring sector is highlighted: type its frequency. Also: frequency → sector number."},
  MVA:{t:"Minimum vectoring altitudes",d:"A part of the TMA or one of the small circles is highlighted: type the MVA in feet."},
  VERT:{t:"Vertical limits of the sub-sectors",d:"A part of the TMA is highlighted: type its upper and lower limit."}
};
const VB=[100,440,1320,1160];               // full map window
const LINES=[[[100,761],[1121,951],[1376,1016],[1420,1027]],[[1064,440],[985,612]],[[427,1440],[257,1600]],[[1134,1526],[1167,1600]]];
const SECT_LBL={N:[828,578],NC:[836,700],C:[935,890],W:[268,1165],SW:[712,1430],SE:[1080,1440],E:[1210,1045]};
const ADJ_LBL={"1":[380,560],"2X":[180,1520],"3":[960,1575],"4":[1350,1470],"5":[1270,560]};
const ENTRY_PTS=PTS.filter(p=>p.e);
const BYN=Object.fromEntries(PTS.map(p=>[p.n,p]));

// ---------- helpers ----------
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pts=p=>p.map(([x,y])=>x+","+y).join(" ");
const fmtLvl=s=>s.startsWith("FL")?s:s.replace("ft"," ft");

// ---------- answer parsing ----------
const normName=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");
function parseFreq(s){
  const t=String(s).replace(",",".").replace(/\s+/g,"");
  let m=t.match(/^(\d{3})\.(\d{1,3})$/);if(m)return +(m[1]+"."+m[2]);
  m=t.match(/^(\d{3})(\d{1,3})$/);if(m)return +(m[1]+"."+m[2]);
  m=t.match(/^(\d{3})$/);if(m)return +m[1];
  return NaN;
}
function parseFt(s){
  const t=String(s).toUpperCase().replace(/[\s,.']/g,"").replace(/(FT|FEET)?(MSL|AMSL)?$/,"");
  return /^\d+$/.test(t)?+t:NaN;
}
function parseLevel(s){
  const t=String(s).toUpperCase().replace(/[\s,.']/g,"");
  let m=t.match(/^FL(\d{2,3})$/);if(m)return"FL"+(+m[1]);
  m=t.match(/^(\d+)(FT|FEET)?(MSL|AMSL)?$/);
  if(!m)return null;
  const n=+m[1];
  if(m[2]||m[3]||n>=1000)return n+"ft";
  return"FL"+n;
}
const sameLvl=(a,b)=>a&&b&&a===b;

// ---------- map ----------
function symbol(p,cls){
  const {x,y,k}=p,s=12;
  if(k==="tri"||k==="ftri"){
    const d=`M${x},${y-s} L${x+s*.98},${y+s*.72} L${x-s*.98},${y+s*.72} Z`;
    return `<path d="${d}" class="${k==="ftri"?"symf":"symp"}"/>`;
  }
  if(k==="vor"){
    const h=7.5,hex=[0,60,120,180,240,300].map(a=>[x+h*Math.cos(a*Math.PI/180),y+h*Math.sin(a*Math.PI/180)]);
    return `<rect x="${x-12}" y="${y-11}" width="24" height="22" class="symp"/><polygon points="${pts(hex.map(([a,b])=>[a.toFixed(1),b.toFixed(1)]))}" class="sym"/><circle cx="${x}" cy="${y}" r="2" class="symf"/>`;
  }
  // locator / NDB
  return `<circle cx="${x}" cy="${y}" r="13" class="sym" stroke-dasharray="2 3"/><circle cx="${x}" cy="${y}" r="7.5" class="sym" stroke-dasharray="2 2.5"/><circle cx="${x}" cy="${y}" r="2.5" class="symf"/>`;
}
const LOFF={n:[0,-20,"middle"],s:[0,33,"middle"],e:[17,8,"start"],w:[-17,8,"end"],ne:[12,-16,"start"],nw:[-12,-16,"end"],se:[14,26,"start"],sw:[-14,26,"end"]};
function label(p,cls){
  const [dx,dy,a]=LOFF[p.l]||LOFF.n;
  return `<text x="${p.x+dx}" y="${p.y+dy}" text-anchor="${a}" font-size="23" class="${cls||""}">${p.n}</text>`;
}
function viewFor(o){
  if(!o.zoom)return VB;
  let cx,cy;
  if(o.point){cx=o.point.x;cy=o.point.y}
  else if(o.circle){cx=o.circle.x;cy=o.circle.y}
  else return VB;
  const w=640,h=560;
  const x=Math.min(Math.max(cx-w/2,VB[0]),VB[0]+VB[2]-w),y=Math.min(Math.max(cy-h/2,VB[1]),VB[1]+VB[3]-h);
  return [x,y,w,h];
}
/* o: {point, sector, circle, adj, labels:"none"|"target"|"all", showCirc, overlay:"vert"|"mva"|"freq", zoom} */
function mapSVG(o){
  const v=viewFor(o);
  let s=`<svg class="map" viewBox="${v.join(" ")}" role="img" aria-label="${esc(o.aria||"Horn TMA map")}" preserveAspectRatio="xMidYMid meet">`;
  s+=`<rect class="out" x="${VB[0]}" y="${VB[1]}" width="${VB[2]}" height="${VB[3]}"/>`;
  if(o.overlay==="freq")ADJ.forEach(a=>s+=`<polygon points="${pts(a.p)}" fill="${ADJCOL[a.id]}" opacity=".35"/>`);
  SECT.forEach(z=>s+=`<polygon points="${pts(z.p)}" class="tma"/>`);
  if(o.adj)s+=`<polygon points="${pts(o.adj.p)}" class="adj"/>`;
  if(o.overlay==="mva")SECT.forEach(z=>s+=`<polygon points="${pts(z.p)}" fill="${MVACOL[z.mva]}" opacity=".5"/>`);
  if(o.sector)s+=`<polygon points="${pts(o.sector.p)}" class="sub-hl"/>`;
  CTRS.forEach(c=>s+=`<polygon points="${pts(c)}" class="ctr"/>`);
  LINES.forEach(l=>s+=`<polyline points="${pts(l)}" class="dash"/>`);
  if(o.showCirc||o.circle)CIRC.forEach(c=>s+=`<circle cx="${c.x}" cy="${c.y}" r="${c.r}" class="circ${o.circle===c?" hl":""}"/>`);
  PTS.forEach(p=>s+=symbol(p));
  if(o.labels==="all")PTS.forEach(p=>s+=label(p,o.point===p?"tgt":""));
  // overlays
  if(o.overlay==="vert")SECT.forEach(z=>{const [x,y]=SECT_LBL[z.id];s+=`<text x="${x}" y="${y-6}" text-anchor="middle" font-size="27" class="ov">${z.up}</text><text x="${x}" y="${y+22}" text-anchor="middle" font-size="27" class="ov">${z.lo}</text>`});
  if(o.overlay==="mva"){SECT.forEach(z=>{const [x,y]=SECT_LBL[z.id];s+=`<text x="${x}" y="${y+8}" text-anchor="middle" font-size="30" class="ov">${z.mva} ft</text>`});
    CIRC.forEach(c=>s+=`<text x="${c.x}" y="${c.y+8}" text-anchor="middle" font-size="22" class="ov">${c.mva}</text>`)}
  if(o.overlay==="freq")ADJ.forEach(a=>{const [x,y]=ADJ_LBL[a.id];s+=`<text x="${x}" y="${y-8}" text-anchor="middle" font-size="58" class="big">${a.id}</text><text x="${x}" y="${y+26}" text-anchor="middle" font-size="28" class="big">${a.f}</text>`});
  if(o.point){
    s+=`<circle cx="${o.point.x}" cy="${o.point.y}" r="25" class="ring"/><circle cx="${o.point.x}" cy="${o.point.y}" r="25" class="pulse"/>`;
    if(o.labels==="target")s+=label(o.point,"tgt");
  }
  if(o.answerText&&o.answerAt)s+=`<text x="${o.answerAt[0]}" y="${o.answerAt[1]}" text-anchor="middle" font-size="32" class="tgt big">${esc(o.answerText)}</text>`;
  return s+"</svg>";
}
const ADJCOL={"1":"#4E8FCC","2X":"#E0606F","3":"#F2C14E","4":"#E58A3A","5":"#7CC48A"};
const MVACOL={5000:"#E0707A",2500:"#A38BC9",2000:"#8CC79A",3000:"#F2C14E"};

// ---------- questions ----------
function qPoint(p,topic){
  return {topic,kind:"point",target:p.n,answer:p.n,
    prompt:topic==="ENTRY"?"Which TMA entry/exit point is highlighted?":"Which point is highlighted?",
    map:{point:p},fields:[{label:"Point name",ph:"e.g. ABCDE"}],
    check:v=>normName(v[0])===p.n,
    expl:`<b>${p.n}</b>${p.e?" is an entry/exit point on the TMA boundary.":"."}${p.k==="vor"?" It is a VOR/DME.":p.k==="ndb"?" It is a locator (NDB).":p.k==="ftri"?" It is a Horn CTR entry/exit point.":""}`};
}
function qFreq(a){
  return {topic:"FREQ",kind:"freq",target:"Sector "+a.id,answer:a.f,
    prompt:"What is the frequency of the highlighted adjacent sector?",
    map:{adj:a},fields:[{label:"Frequency",ph:"e.g. 123.450",mode:"decimal"}],
    check:v=>Math.abs(parseFreq(v[0])-+a.f)<0.0005,
    expl:`Sector <b>${a.id}</b> is on <b>${a.f}</b>.`,
    after:{answerText:a.id+"  "+a.f,answerAt:ADJ_LBL[a.id]}};
}
function qFreqRev(a){
  return {topic:"FREQ",kind:"freqRev",target:"Sector "+a.id,answer:a.id,
    prompt:`Which adjacent sector is on <b>${a.f}</b>? Type the sector number.`,
    map:null,fields:[{label:"Sector",ph:"e.g. 1"}],
    check:v=>normName(v[0]).replace(/^SECTOR/,"")===a.id,
    expl:`<b>${a.f}</b> is sector <b>${a.id}</b>. All adjacent sectors: ${ADJ.map(x=>`${x.id} ${x.f}`).join(" · ")}.`};
}
function qMva(z){
  return {topic:"MVA",kind:"mva",target:z.name,answer:z.mva+" ft",
    prompt:"What is the MVA in the highlighted area?",
    map:{sector:z,showCirc:true},fields:[{label:"MVA (ft MSL)",ph:"e.g. 1800",mode:"numeric"}],
    check:v=>parseFt(v[0])===z.mva,
    expl:`The MVA in the <b>${esc(z.name)}</b> part of the TMA is <b>${z.mva} ft MSL</b>.`,
    after:{answerText:z.mva+" ft",answerAt:[SECT_LBL[z.id][0],SECT_LBL[z.id][1]+10]}};
}
function qCirc(c){
  return {topic:"MVA",kind:"mvaCirc",target:"Circle "+c.mva,answer:c.mva+" ft",
    prompt:"What is the MVA inside the highlighted circle?",
    map:{circle:c,showCirc:true},fields:[{label:"MVA (ft MSL)",ph:"e.g. 1800",mode:"numeric"}],
    check:v=>parseFt(v[0])===c.mva,
    expl:`The small circle has an MVA of <b>${c.mva} ft MSL</b>, different from the area around it.`,
    after:{answerText:String(c.mva),answerAt:[c.x,c.y+12]}};
}
function qVert(z){
  return {topic:"VERT",kind:"vert",target:z.name,answer:`${fmtLvl(z.up)} / ${fmtLvl(z.lo)}`,
    prompt:"What are the vertical limits of the highlighted part of the TMA?",
    map:{sector:z},fields:[{label:"Upper limit",ph:"e.g. FL100"},{label:"Lower limit",ph:"e.g. 1000ft"}],
    check:v=>sameLvl(parseLevel(v[0]),z.up)&&sameLvl(parseLevel(v[1]),z.lo),
    expl:`The <b>${esc(z.name)}</b> part of the TMA is <b>${fmtLvl(z.up)}</b> (upper) to <b>${fmtLvl(z.lo)}</b> (lower). Type levels as FL205 and altitudes as 2000ft.`,
    after:{answerText:`${z.up} / ${z.lo}`,answerAt:[SECT_LBL[z.id][0],SECT_LBL[z.id][1]+10]}};
}
function buildPools(topics){
  const P={};
  if(topics.has("ENTRY"))P.ENTRY=ENTRY_PTS.map(p=>qPoint(p,"ENTRY"));
  if(topics.has("POINT"))P.POINT=PTS.filter(p=>!(topics.has("ENTRY")&&p.e)).map(p=>qPoint(p,"POINT"));
  if(topics.has("FREQ"))P.FREQ=ADJ.map(qFreq).concat(ADJ.map(qFreqRev));
  if(topics.has("MVA"))P.MVA=SECT.map(qMva).concat(CIRC.map(qCirc));
  if(topics.has("VERT"))P.VERT=SECT.map(qVert);
  return P;
}
function buildDeck(topics,n){
  const P=buildPools(topics),keys=Object.keys(P).filter(k=>P[k].length);
  const total=keys.reduce((s,k)=>s+P[k].length,0);
  if(!keys.length)return[];
  if(n==="all"||n>=total)return shuffle(keys.flatMap(k=>P[k]));
  // share questions in proportion to pool size, at least 1 per topic
  const quota={};keys.forEach(k=>quota[k]=Math.min(P[k].length,Math.max(1,Math.round(n*P[k].length/total))));
  let sum=keys.reduce((s,k)=>s+quota[k],0);
  for(let g=0;sum!==n&&g<1000;g++){
    for(const k of shuffle(keys)){
      if(sum<n&&quota[k]<P[k].length){quota[k]++;sum++}
      else if(sum>n&&quota[k]>1){quota[k]--;sum--}
      if(sum===n)break;
    }
  }
  return shuffle(keys.flatMap(k=>shuffle(P[k]).slice(0,quota[k])));
}

// ---------- UI ----------
if(typeof document!=="undefined"&&document.getElementById("app")){
const app=document.getElementById("app");
const st={screen:"start",topics:new Set(["ENTRY"]),n:20,zoom:false,deck:[],i:0,checked:false,res:[],given:[],study:"names"};
const tcount=k=>({ENTRY:ENTRY_PTS.length,POINT:PTS.length,FREQ:ADJ.length*2,MVA:SECT.length+CIRC.length,VERT:SECT.length})[k];
const total=()=>Object.values(buildPools(st.topics)).reduce((s,l)=>s+l.length,0);
const estimate=()=>{const t=total();return st.n==="all"?t:Math.min(st.n,t)};
function start(){
  st.deck=buildDeck(st.topics,st.n);if(!st.deck.length)return;
  st.i=0;st.res=[];st.given=[];st.checked=false;renderQ();window.scrollTo(0,0);
}
function studyMap(){
  const m=st.study;
  return mapSVG({labels:m==="names"||m==="entry"?"all":"none",overlay:m==="vert"?"vert":m==="mva"?"mva":m==="freq"?"freq":null,showCirc:m==="mva",aria:"Study map"});
}
function refHTML(){
  return `<div class="toggles" role="group" aria-label="Study map layer">${[["names","Point names"],["vert","Vertical limits"],["mva","MVA"],["freq","Adjacent sectors"]].map(([k,v])=>`<button class="mini-btn" data-s="${k}" aria-pressed="${st.study===k}">${v}</button>`).join("")}</div>
  <div id="study">${studyMap()}</div>
  <h3>TMA entry/exit points (${ENTRY_PTS.length})</h3><div class="namelist">${ENTRY_PTS.map(p=>`<div>${p.n}</div>`).join("")}</div>
  <h3>All points in the TMA (${PTS.length})</h3><div class="namelist">${PTS.map(p=>p.n).sort().map(n=>`<div>${n}</div>`).join("")}</div>
  <h3>Sub-sectors</h3><div class="tw"><table><tr><th>Part of the TMA</th><th>Upper</th><th>Lower</th><th class="n">MVA</th></tr>${SECT.map(z=>`<tr><td>${esc(z.name)}</td><td>${fmtLvl(z.up)}</td><td>${fmtLvl(z.lo)}</td><td class="n">${z.mva} ft</td></tr>`).join("")}
  ${CIRC.map(c=>`<tr><td>Small circle (${c.mva===2900?"north-east of DEENA, near IDN":"south-east of POLKA"})</td><td></td><td></td><td class="n">${c.mva} ft</td></tr>`).join("")}</table></div>
  <h3>Adjacent sectors</h3><div class="tw"><table><tr><th>Sector</th><th>Frequency</th></tr>${ADJ.map(a=>`<tr><td>${a.id}</td><td>${a.f}</td></tr>`).join("")}</table></div>
  <p class="legend">Traced from the EPN training charts ESHH 4-1-1, 4-2-1, 4-9-1 and 4-10-1. The map is a simplified redraw; the official charts remain the reference.</p>`;
}
function renderStart(){
  st.screen="start";const est=estimate();
  app.innerHTML=`<h1>Horn TMA chart quiz</h1>
  <p class="lede">Practise the Horn TMA charts from memory: points, adjacent sector frequencies, MVAs and the vertical limits of each part of the TMA. Names are hidden on the map; type your answer.</p>
  <div class="sect">Topics (choose one or more)</div>
  <div class="picker" role="group" aria-label="Topics">${Object.entries(TOPICS).map(([k,v])=>`<button class="chip" style="--c:var(--${k})" aria-pressed="${st.topics.has(k)}" data-k="${k}"><span class="sw"></span><span><b>${v.t}</b><small>${v.d}</small></span><span class="ct">${tcount(k)}</span></button>`).join("")}</div>
  <div class="opts"><label>Number of questions
    <select id="n">${[10,20,30,50].map(x=>`<option value="${x}" ${st.n===x?"selected":""}>${x}</option>`).join("")}<option value="all" ${st.n==="all"?"selected":""}>All available</option></select></label></div>
  <button class="primary" id="go" ${est?"":"disabled"}>Start ${est} question${est===1?"":"s"}</button>
  <p class="legend">Press <b>Enter</b> to check and again to continue. Point names are not case-sensitive. Type levels as <b>FL205</b> and altitudes as <b>2000ft</b> (or just 2000). If you pick both point topics, entry/exit points are counted under their own topic and not asked twice.</p>
  <details class="ref" id="ref"><summary>Study map and reference</summary>${refHTML()}</details>`;
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;st.topics.has(k)?st.topics.delete(k):st.topics.add(k);renderStart()});
  app.querySelector("#n").onchange=e=>{st.n=e.target.value==="all"?"all":Number(e.target.value);renderStart()};
  app.querySelector("#go").onclick=start;
  const ref=app.querySelector("#ref");if(st.refOpen)ref.open=true;ref.ontoggle=()=>{st.refOpen=ref.open};
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{st.study=b.dataset.s;app.querySelectorAll("[data-s]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.s===st.study)));app.querySelector("#study").innerHTML=studyMap()});
}
function qMap(q,revealed){
  if(!q.map)return"";
  const o=Object.assign({},q.map,{zoom:st.zoom,aria:"Map with the item to identify highlighted"});
  if(revealed){if(q.kind==="point")o.labels="target";else Object.assign(o,q.after||{})}
  return mapSVG(o);
}
function renderQ(){
  st.screen="q";
  const q=st.deck[st.i],tot=st.deck.length;
  const answered=st.res.filter(x=>x!==undefined).length,right=st.res.filter(Boolean).length;
  const canZoom=q.map&&(q.map.point||q.map.circle);
  app.innerHTML=`<div class="top"><span>Question ${st.i+1} of ${tot}</span><span>${right} correct of ${answered} answered</span></div>
  <div class="bar"><i style="width:${st.i/tot*100}%"></i></div>
  <article class="strip" style="--c:var(--${q.topic})"><div class="bay"></div><div class="body">
    <div class="meta"><span>${TOPICS[q.topic].t}</span><span>Type your answer</span></div>
    <p class="qtext">${q.prompt}</p>
    ${canZoom?`<div class="maptools"><button class="mini-btn" id="zoom" aria-pressed="${st.zoom}">${st.zoom?"Zoomed in":"Zoom in"}</button></div>`:""}
    <div id="mapbox">${qMap(q,false)}</div>
    <form class="ans" id="form" autocomplete="off">${q.fields.map((f,k)=>`<label>${f.label}<input id="in${k}" type="text" ${f.mode?`inputmode="${f.mode}"`:""} autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="${f.ph}"></label>`).join("")}
      <button class="primary" id="act" type="submit">Check</button></form>
    <div id="fb"></div>
  </div></article>
  <div class="actions"><button class="ghost" id="quit">End and see results</button></div>`;
  const z=app.querySelector("#zoom");
  if(z)z.onclick=()=>{st.zoom=!st.zoom;z.setAttribute("aria-pressed",String(st.zoom));z.textContent=st.zoom?"Zoomed in":"Zoom in";app.querySelector("#mapbox").innerHTML=qMap(q,st.checked)};
  app.querySelector("#form").onsubmit=e=>{e.preventDefault();st.checked?next():check()};
  app.querySelector("#quit").onclick=renderResults;
  const f=app.querySelector("#in0");if(f&&matchMedia("(hover:hover)").matches)f.focus({preventScroll:true});
}
function check(){
  const q=st.deck[st.i];
  const ins=[...app.querySelectorAll("form.ans input")],vals=ins.map(i=>i.value.trim());
  if(vals.every(v=>!v)){ins[0].focus();return}
  st.checked=true;const ok=q.check(vals);st.res[st.i]=ok;st.given[st.i]=vals.join(" / ");
  ins.forEach(i=>{i.disabled=true;i.classList.add(ok?"good":"bad")});
  showFb(q,ok);
  app.querySelector("#mapbox").innerHTML=qMap(q,true);
  const b=app.querySelector("#act");b.textContent=st.i+1<st.deck.length?"Next question":"See results";b.focus({preventScroll:true});
  app.querySelector(".bar i").style.width=((st.i+1)/st.deck.length*100)+"%";
}
function showFb(q,ok){
  app.querySelector("#fb").innerHTML=`<div class="fb" style="--c2:var(${ok?"--ok":"--bad"})"><strong>${ok?"Correct.":"Not quite."}</strong><p>${ok?"":`Answer: <b>${esc(q.answer)}</b>. `}${q.expl}</p>${ok?"":`<button class="override" id="ovr" type="button">I had it right (typo or other format), count it as correct</button>`}</div>`;
  const o=app.querySelector("#ovr");
  if(o)o.onclick=()=>{st.res[st.i]=true;app.querySelectorAll("form.ans input").forEach(i=>{i.classList.remove("bad");i.classList.add("good")});showFb(q,true);app.querySelector("#act").focus({preventScroll:true})};
}
function next(){
  st.i++;st.checked=false;
  st.i<st.deck.length?renderQ():renderResults();
  window.scrollTo(0,0);
}
function renderResults(){
  st.screen="r";
  const idx=st.deck.map((q,i)=>i).filter(i=>st.res[i]!==undefined);
  const right=idx.filter(i=>st.res[i]).length,pct=idx.length?Math.round(right/idx.length*100):0;
  const m={};idx.forEach(i=>{const g=st.deck[i].topic;m[g]=m[g]||[0,0];m[g][1]++;if(st.res[i])m[g][0]++});
  const missedI=idx.filter(i=>!st.res[i]),missed=missedI.map(i=>st.deck[i]);
  app.innerHTML=`<h1>Results</h1>
  <div class="score">${pct}%</div>
  <p class="lede">${right} correct out of ${idx.length} answered${idx.length<st.deck.length?` (${st.deck.length-idx.length} not attempted)`:""}.</p>
  ${idx.length?`<h2>By topic</h2><div class="tw"><table><tr><th>Topic</th><th class="n">Correct</th><th class="n">Score</th></tr>${Object.entries(m).map(([g,[r,t]])=>`<tr><td>${TOPICS[g].t}</td><td class="n">${r} / ${t}</td><td class="n">${Math.round(r/t*100)}%</td></tr>`).join("")}</table></div>`:""}
  <div class="actions" style="justify-content:flex-start">${missed.length?`<button class="primary" id="retry">Retry ${missed.length} missed</button>`:""}<button class="ghost" id="new">New quiz</button></div>
  ${missed.length?`<h2>Review missed questions</h2>${missedI.map(i=>{const q=st.deck[i];return`<div class="miss" style="--c:var(--${q.topic})"><div><p class="ref">${TOPICS[q.topic].t}</p><p>${q.prompt}</p><p class="yours">Your answer: ${esc(st.given[i]||"–")}</p><p class="ans">Answer: ${esc(q.answer)}</p></div><div>${q.map?mapSVG(Object.assign({},q.map,q.kind==="point"?{labels:"target",zoom:true}:(q.after||{}))):""}</div></div>`}).join("")}`:""}`;
  const r=app.querySelector("#retry");
  if(r)r.onclick=()=>{st.deck=shuffle(missed);st.i=0;st.res=[];st.given=[];st.checked=false;renderQ();window.scrollTo(0,0)};
  app.querySelector("#new").onclick=renderStart;
  window.scrollTo(0,0);
}
renderStart();
window.__cq={st};
}
</script>
